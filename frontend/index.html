<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Find vacant houses and commercial spaces near you, with live availability from the people who manage them." />
    <title>KHunt: find vacant rentals</title>
    <script>
      // Applies the saved theme before first paint (dark by default), so it does not flash light.
      // Keep the default in step with ThemeProvider. Also sets the saved page language.
      try {
        if (localStorage.getItem('khunt-language') === 'sw') document.documentElement.lang = 'sw';
        var t = localStorage.getItem('khunt-theme');
        if (!t || t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
