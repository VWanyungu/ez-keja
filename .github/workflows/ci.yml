name: CI

# Pull requests into staging and main, and pushes to staging (git-workflow.md: localhost -> PR -> staging -> main).
# There is deliberately NO deploy job yet: it needs server details and secrets that are not known. See
# "Deploying" in backend/README.md for exactly what it needs.
on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: '1.4.2'

jobs:
  backend:
    name: Backend (typecheck, unit, integration)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          # The image makes POSTGRES_USER a superuser, which includes CREATEDB. The integration runner
          # needs it because it creates a throwaway khunt_test_<timestamp> database for every run.
          POSTGRES_USER: khunt
          POSTGRES_PASSWORD: khunt_ci_only
          POSTGRES_DB: khunt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U khunt -d khunt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # No mail, Cloudinary or Maps secrets on purpose: the suites inject fakes, and the test scripts
    # blank the mail variables themselves. These are throwaway values for the service container above.
    env:
      NODE_ENV: development
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USER: khunt
      DB_PASSWORD: khunt_ci_only
      DB_NAME: khunt
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else

    steps:
      - uses: actions/checkout@v5.0.0

      - uses: oven-sh/setup-bun@v2.1.3
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Integration tests (throwaway database on the Postgres service)
        run: bun run test:integration

  commitlint:
    name: Commit messages (Conventional Commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2.1.3
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Uses backend/commitlint.config.js. Merge commits are ignored by commitlint's defaults.
      - name: Lint the commits of this pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bunx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  branch-name:
    name: Branch name (git-workflow.md)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # The branch name reaches the shell through an environment variable, never through ${{ }} in the script.
      - name: Validate the branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          regex='^(feature|bugfix|hotfix|release|docs|chore|cleanup)/[a-z0-9]+(-[a-z0-9]+)*$'
          release_regex='^release/[a-z0-9]+([.-][a-z0-9]+)*$'
          if [[ "$BRANCH" =~ $regex || "$BRANCH" =~ $release_regex ]]; then
            echo "Branch name OK: $BRANCH"
          else
            echo "::error::Branch '$BRANCH' does not match <prefix>/<description>: lowercase a-z, 0-9 and single hyphens after one of feature, bugfix, hotfix, release, docs, chore, cleanup (see .claude/skills/synergetic-standards/references/git-workflow.md)."
            exit 1
          fi
